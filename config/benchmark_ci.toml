[window]
width = 1280
height = 720
title = "RoboMaster AimSim Benchmark"

[physics]
fixed_hz = 120.0
gravity_mps2 = 9.80665

[camera]
width = 1280
height = 720
fps = 60.0
vertical_fov_deg = 60.0
jpeg_quality = 85
right_m = 0.0
above_m = 0.045
forward_m = -0.10

[shooter]
gimbal_height_m = 1.10
barrel_length_m = 0.55
barrel_radius_m = 0.018
muzzle_offset_m = 0.55
yaw_limit_deg = 180.0
pitch_min_deg = -35.0
pitch_max_deg = 30.0
max_yaw_speed_dps = 720.0
max_pitch_speed_dps = 540.0

[operator]
# Interactive controls:
#   W/A/S/D = chassis translation
#   mouse = manual gimbal aim
#   hold RMB = enable external auto-aim yaw/pitch
#   hold LMB = operator trigger; a projectile is emitted only when RMB is also held and auto-aim fire=true
#   F1 = enter/leave robot control (the cursor starts released for GUI use)
chassis_move_speed_mps = 2.5
mouse_sensitivity_yaw_deg = 0.12
mouse_sensitivity_pitch_deg = 0.10
move_relative_to_gimbal = true
command_timeout_s = 0.35
cursor_grab_on_start = false
benchmark_auto_hold_inputs = true

[target]
initial_distance_m = 5.0
armor_center_height_m = 0.50
armor_width_m = 0.135
armor_height_m = 0.055
armor_thickness_m = 0.010
front_back_radius_m = 0.280
left_right_radius_m = 0.280
rpm = 60.0
path = "figure_eight"
translation_speed_mps = 1.0
half_extent_x_m = 2.0
half_extent_z_m = 1.0
max_hp = 500.0
damage_per_hit = 10.0
freeze_when_dead = false

[projectile]
diameter_m = 0.017
speed_mps = 15.0
mass_kg = 0.0032
cooldown_s = 0.08
lifetime_s = 3.0
linear_damping = 0.0

[network]
command_bind = "127.0.0.1:39000"
telemetry_target = "127.0.0.1:39001"
camera_bind = "127.0.0.1:39002"
telemetry_hz = 120.0

[benchmark]
distances_m = [3.0, 5.0, 7.0, 10.0]
rpms = [0.0, 30.0, 60.0, 120.0, 180.0]
translation_speeds_mps = [0.0, 1.0, 2.0, 3.0]
rounds_per_trial = 100
repeats_per_condition = 3
warmup_s = 1.0
case_timeout_s = 25.0
post_fire_grace_s = 1.2
dps_window_s = 1.0
output_dir = "benchmark_results"
autostart = true
