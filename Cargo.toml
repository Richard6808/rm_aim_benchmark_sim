[package]
name = "rm_aim_benchmark_sim"
version = "0.2.0"
edition = "2024"
description = "Standalone RoboMaster four-armor auto-aim closed-loop simulator and benchmark runner"
license = "MIT"
default-run = "rm_aim_benchmark_sim"

[dependencies]
anyhow = "1"
avian3d = "0.7"
bevy = "0.19"
bevy_egui = "0.41.1"
clap = { version = "4.6", features = ["derive"] }
crossbeam-channel = "0.5"
csv = "1.3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
